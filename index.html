<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Game Probability Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-name { font-weight: 600; color: #4b5563; }
        .result-table th, .result-table td { padding: 0.5rem; text-align: left; }
        .result-table thead th { background-color: #1f2937; color: white; }
        .tab-button {
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
        }
        .tab-button.active {
            background-color: #ffffff;
            color: #4f46e5;
            border-color: #e5e7eb;
            transform: translateY(1px); /* Lifts tab */
        }
        .tab-button:not(.active) {
            background-color: #e5e7eb;
            color: #6b7280;
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl">
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-200">
            <button id="alchemy-tab-btn" class="tab-button active" onclick="switchTab('alchemy')">🧪 Alchemy</button>
            <button id="kitchen-tab-btn" class="tab-button" onclick="switchTab('kitchen')">🔪 Kitchen</button>
            <button id="forge-tab-btn" class="tab-button" onclick="switchTab('forge')">🔥 Forge</button>
        </div>

        <!-- Main Content Area -->
        <div id="app-container" class="p-6">
            
            <h1 id="game-title" class="text-3xl font-bold text-center text-gray-800 mb-2">
                🧪 Alchemy Game Simulator
            </h1>
            <p class="text-center text-sm text-gray-500 mb-6">
                Simulates 10,000 trials for every valid card combination to find the highest probability of success.
            </p>

            <!-- Card Definitions -->
            <div id="card-definitions" class="bg-indigo-50 p-4 rounded-lg mb-6 border border-indigo-200">
                <!-- Card definitions will be injected here -->
            </div>

            <!-- Optional Bonuses Container -->
            <div id="optional-bonuses-container" class="mb-4 p-4 border border-gray-200 rounded-lg hidden">
                <!-- Checkboxes injected here -->
            </div>


            <!-- Input Form -->
            <div class="flex flex-col sm:flex-row gap-4 mb-6">
                <div class="flex-1">
                    <label for="setupSelector" class="block text-sm font-medium text-gray-700" id="setup-label">Production</label>
                    <select id="setupSelector" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white" required>
                        <!-- Options injected here -->
                    </select>
                </div>
                <div class="flex-1">
                    <label for="numCards" class="block text-sm font-medium text-gray-700" id="num-cards-label">Cards to Draw (3-9)</label>
                    <input type="number" id="numCards" value="6" min="3" max="9" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    <p class="text-xs text-gray-500 mt-1" id="startingBonusText"></p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mb-6 items-end">
                <div class="flex-1">
                    <label for="threshold1" class="block text-sm font-medium text-gray-700">Primary Threshold (&gt; X)</label>
                    <input type="number" id="threshold1" value="6630" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                </div>
                
                <div class="flex-shrink-0 mb-1">
                    <button id="swapThresholds" class="p-2 w-full sm:w-auto bg-gray-200 hover:bg-gray-300 rounded-lg shadow-sm text-gray-700 font-semibold text-sm transition duration-150" title="Swap Primary and Secondary Thresholds">
                        &#x21C6; Swap
                    </button>
                </div>
                
                <div class="flex-1">
                    <label for="threshold2" class="block text-sm font-medium text-gray-700">Secondary Threshold (&gt; Y)</label>
                    <input type="number" id="threshold2" value="8200" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                </div>
            </div>


            <button id="runSimulation" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 disabled:bg-indigo-300">
                Run Simulation
            </button>

            <div id="loadingIndicator" class="mt-4 hidden text-center text-indigo-600 font-semibold">
                Calculating... This may take a moment.
            </div>

            <!-- Results Table -->
            <div id="resultsArea" class="mt-8">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Top 5 Combinations</h2>
                <div class="overflow-x-auto">
                    <table id="resultsTable" class="result-table min-w-full rounded-lg shadow-lg hidden">
                        <thead>
                            <tr>
                                <th class="rounded-tl-lg">Rank</th>
                                <th>Combination</th> <!-- UPDATED: Removed (Count) and Effects -->
                                <th class="text-right">P(&gt;T1)</th>
                                <th class="rounded-tr-lg text-right">P(&gt;T2)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Results injected here -->
                        </tbody>
                    </table>
                </div>
                <p id="noResults" class="hidden text-center text-gray-500 mt-4">No combinations reached the primary threshold.</p>
                <p id="totalCombinations" class="text-xs text-gray-400 mt-4 text-center"></p>
            </div>
        </div>
    </div>

    <script>
        
        // ====================================================================
        // === CORE CONFIGURATION & LOGIC FOR ALL GAMES =======================
        // ====================================================================

        const NUM_SIMULATIONS = 10000;
        const MIN_CARDS = 3; 
        const MAX_CARDS = 9; 

        // --- ALCHEMY GAME CONFIG ---
        const ALCHEMY_CONFIG = {
            id: 'alchemy',
            title: '🧪 Alchemy Game Simulator',
            cardMaxes: { 'A': 4, 'B': 4, 'C': 1, 'D': 2, 'E': 2, 'F': 1, 'H': 2 },
            cardDetails: {
                'A': 'Ingredients (max 4): +20 to Highest Color, -4 to Lowest Color.',
                'B': 'Grind (max 4): +15 to Lowest Color, -5 to Highest Color.',
                'C': 'Distill (max 1): x2 to Highest Color.',
                'D': 'Overload (max 2): +40 to Highest Color. -3 to random color per subsequent card effect triggered.',
                'E': 'Enchant (max 2): +30 to Lowest Color. -1 to All Colors per subsequent card effect triggered.',
                'F': 'Fuse (max 1): +10 to All Colors if Final Point Gap < 20.',
                'H': 'Overcharge (max 2): Prevents additions to Lowest Color from Next 2 cards. Instead, adds 3x their value to Highest Color.'
            },
            setupConfigs: {
                'earth_essence': { name: 'Earth Essence', numCards: 6, t1: 4550, t2: 10000, bonusType: 'none' },
                'extraction_flask': { name: 'Extraction Flask', numCards: 7, t1: 6270, t2: 13200, bonusType: 'none' },
                'refined_illusion': { name: 'Refined Illusion Potion', numCards: 7, t1: 5150, t2: 10900, bonusType: 'none' },
                'fireward_ring': { name: 'Fireward Ring', numCards: 9, t1: 6630, t2: 8200, bonusType: 'firewardRingStart' } // +15 to Random Color at Start
            },
            simulateGame: (cardPermutation, startingBonusType, optionalSettings) => {
                let x = 1; let y = 1;
                
                // --- Configurable B values ---
                const bAdd = optionalSettings.grindLevel7 ? 20 : 15;
                const bSub = optionalSettings.grindLevel7 ? 6 : 5;
                
                // --- Configurable F values ---
                const fLimit = optionalSettings.fuseLevel3 ? 50 : 20;
                const fAdd = optionalSettings.fuseLevel3 ? 20 : 10;
                const fRedistribute = optionalSettings.fuseLevel3;

                // --- Fireward Ring Initial Bonus ---
                if (startingBonusType === 'firewardRingStart') {
                    Math.random() < 0.5 ? x += 15 : y += 15;
                }
                
                let dOverloadActive = 0; let eEnchantActive = 0;
                let fFuseDrawn = false; let hOverchargeCount = 0; 

                for (const card of cardPermutation) {
                    const isXHighest = x >= y;
                    let highestColor = isXHighest ? x : y;
                    let lowestColor = isXHighest ? y : x;
                    let lowestAddition = 0;

                    if (card === 'H') { hOverchargeCount += 2; }
                    else if (card === 'A') { highestColor += 20; lowestColor -= 4; }
                    else if (card === 'B') {
                        highestColor -= bSub; // Configurable subtraction
                        lowestAddition = bAdd; // Configurable addition
                        if (hOverchargeCount > 0) { highestColor += (lowestAddition * 3); hOverchargeCount -= 1; } 
                        else { lowestColor += lowestAddition; }
                    }
                    else if (card === 'C') { highestColor *= 2; }
                    else if (card === 'D') { highestColor += 40; dOverloadActive += 3; }
                    else if (card === 'E') {
                        lowestAddition = 30;
                        if (hOverchargeCount > 0) { highestColor += (lowestAddition * 3); hOverchargeCount -= 1; } 
                        else { lowestColor += lowestAddition; }
                        eEnchantActive += 1;
                    }
                    else if (card === 'F') { fFuseDrawn = true; }

                    if (isXHighest) { x = clampToMin1(highestColor); y = clampToMin1(lowestColor); } 
                    else { x = clampToMin1(lowestColor); y = clampToMin1(highestColor); }

                    if (dOverloadActive > 0) { // D Penalty
                        const penalty = dOverloadActive;
                        Math.random() < 0.5 ? x = clampToMin1(x - penalty) : y = clampToMin1(y - penalty);
                    }
                    if (eEnchantActive > 0) { // E Penalty
                        const penalty = eEnchantActive;
                        x = clampToMin1(x - penalty);
                        y = clampToMin1(y - penalty);
                    }
                }
                    
                if (fFuseDrawn) { // F End-game
                    const pointGap = Math.abs(x - y);
                    if (pointGap < fLimit) { // Configurable limit
                        x += fAdd; y += fAdd; // Configurable addition
                        if (fRedistribute) { // Configurable redistribution
                            const avg = Math.floor((x + y) / 2);
                            x = avg; y = avg;
                        }
                    }
                }
                    
                return x * y;
            }
        };

        // --- KITCHEN GAME CONFIG ---
        const KITCHEN_CONFIG = {
            id: 'kitchen',
            title: '🔪 Kitchen Game Simulator',
            cardMaxes: { 'A': 4, 'B': 3, 'C': 1, 'D': 2, 'E': 2, 'F': 1 },
            cardDetails: {
                'A': 'Heat Control (max 4): +12 to random color. 50% chance to retrigger recursively.',
                'B': 'Cut (max 3): +10-15 to Random Color.',
                'C': 'Season (max 1): x2 to random color.',
                'D': 'Slow Cook (max 2): +4 to all colors when Heat Control (A) triggers (cumulative).',
                'E': 'Ferment (max 2): Guarantees next Heat Control (A) triggers 2 extra times (non-cumulative).',
                'F': 'Bake (max 1): Redistribute point difference at the end (x = y = (x+y)/2).'
            },
            setupConfigs: {
                'earthy_flatbread': { name: 'Earthy Flatbread', numCards: 6, t1: 9630, t2: 26500, bonusType: 'none' },
                'crispy_blackroot': { name: 'Crispy Blackroot', numCards: 7, t1: 13800, t2: 36200, bonusType: 'none' },
                'salted_corn_chips': { name: 'Salted Corn Chips', numCards: 5, t1: 4620, t2: 12300, bonusType: 'none' },
                'odd_sweet': { name: 'Odd Sweet', numCards: 8, t1: 18500, t2: 30900, bonusType: 'oddSweetEndGame' } // +5 to all colors if the final point gap is less than 5
            },
            simulateGame: (cardPermutation, startingBonusType, optionalSettings) => {
                let x = 1; let y = 1;
                
                // D modifier: 4 or 5 based on optionalSettings
                const dSlowCookBase = optionalSettings.slowCookLevel4 ? 5 : 4;
                let dSlowCookBonus = 0; 

                let eFermentTriggers = 0; 
                let fBakeDrawn = false;
                let fermentUsed = false;
                let cutStreak = 0; // NEW: Streak counter for Card B

                const applyAEffect = (add, recursionDepth = 0) => {
                    if (Math.random() < 0.5) { x += add; } else { y += add; }
                    x += dSlowCookBonus; y += dSlowCookBonus; // D bonus application
                    
                    if (Math.random() < 0.5) { applyAEffect(add, recursionDepth + 1); } // 50% chance to retrigger recursively
                };

                for (const card of cardPermutation) {
                    if (card === 'A') {
                        cutStreak = 0; // Reset streak on non-B card
                        let add = 12;
                        let extraTriggers = eFermentTriggers;
                        if (eFermentTriggers > 0) { eFermentTriggers = 0; } // Consume E's effect

                        applyAEffect(add); // Initial trigger
                        for(let i=0; i<extraTriggers; i++) {
                            applyAEffect(add); // Guaranteed E triggers
                        }
                    } 
                    else if (card === 'B') {
                        const baseAdd = Math.floor(Math.random() * 6) + 10; // 10-15
                        
                        let numTriggers = 1;
                        if (optionalSettings.cutLevel7) {
                            cutStreak += 1; // Increment streak
                            numTriggers += (cutStreak - 1); // Extra triggers: 1st B: 0, 2nd B: 1, 3rd B: 2, etc.
                        } else {
                            cutStreak = 0; // Reset streak if feature is off
                            numTriggers = 1; 
                        }

                        for (let i = 0; i < numTriggers; i++) {
                            if (Math.random() < 0.5) { x += baseAdd; } else { y += baseAdd; }
                        }
                    } 
                    else if (card === 'C') {
                        cutStreak = 0; // Reset streak on non-B card
                        Math.random() < 0.5 ? x *= 2 : y *= 2;
                    } 
                    else if (card === 'D') {
                        cutStreak = 0; // Reset streak on non-B card
                        dSlowCookBonus += dSlowCookBase; // Use the base value (4 or 5)
                    } 
                    else if (card === 'E' && !fermentUsed) {
                        cutStreak = 0; // Reset streak on non-B card
                        eFermentTriggers = 2; // Non-cumulative, sets to 2
                        fermentUsed = true;
                    } 
                    else if (card === 'F') {
                        cutStreak = 0; // Reset streak on non-B card
                        fBakeDrawn = true;
                    }
                    
                    x = clampToMin1(x); y = clampToMin1(y);
                }
                
                if (fBakeDrawn) { // F End-game: Redistribute point difference
                    const avg = Math.floor((x + y) / 2);
                    x = avg;
                    y = avg;
                }

                // --- NEW: Odd Sweet Setup Bonus (End-Game) ---
                if (startingBonusType === 'oddSweetEndGame') {
                    const pointGap = Math.abs(x - y);
                    if (pointGap < 5) {
                        x += 5;
                        y += 5;
                    }
                }
                    
                return x * y;
            }
        };

        // --- FORGE GAME CONFIG ---
        const FORGE_CONFIG = {
            id: 'forge',
            title: '🔥 Forge Game Simulator',
            cardMaxes: { 'A': 4, 'B': 4, 'C': 1, 'D': 2, 'E': 2, 'F': 2, 'G': 2, 'H': 1, 'I': 2 },
            cardDetails: {
                // A: Forge Expert (cumulative bonus re-added)
                'A': 'Forge Expert (max 4): +5 to a random color (X or Y). +5 to subsequent Forge Expert cards (cumulative). (Artisan)', 
                'B': 'Forge (max 4): +10 to a random color (X or Y). (Artisan)',
                'C': 'Ignite (max 1): x2 to random color.',
                'D': 'Heat Up (max 2): Gives +10 to future Artisan cards (A, B, I) (cumulative).',
                'E': 'Charge (max 2): Future Artisan cards (A, B, I) affect all colors (both X and Y).',
                'F': 'Multi-Forge (max 2): Next Artisan card triggers 2 extra times (stacking).',
                'G': 'Reforge (max 2): +3 to all colors when an Artisan effect is triggered (cumulative).',
                'H': 'Sharpening (max 1): +10 to a random color each time a new unseen card is drawn (Non-stacking effect).',
                'I': 'Pyroburst (max 2): +12 to random color. Triggers 2 extra times if at least 2 unique buffs (D, E, F, G) were applied. (Artisan)'
            },
            // Forge Presets (confirmed correct)
            setupConfigs: {
                'thermo_chest': { name: 'Thermo Chest', numCards: 6, t1: 4490, t2: 51000, bonusType: 'none' },
                'iron_mixing_dish': { name: 'Iron Mixing Dish', numCards: 7, t1: 11800, t2: 49000, bonusType: 'none' },
                'firefang_sword': { name: 'Firefang Sword', numCards: 8, t1: 28900, t2: 92100, bonusType: 'firefangSwordA' }, // 30% chance for A to trigger 1 extra time (non recursive)
                'fireproof_helm': { name: 'Fireproof Helm', numCards: 8, t1: 25100, t2: 61700, bonusType: 'fireproofHelmLimit' } // The First 3 "Forge" Cards affect all colors
            },
            simulateGame: (cardPermutation, startingBonusType, optionalSettings) => {
                let x = 1; let y = 1;
                
                // B modifier: 10 or 15 based on optionalSettings
                const bForgeBase = optionalSettings.forgeLevel6 ? 15 : 10;
                
                // G modifier: 3 or 10 based on optionalSettings
                const gReforgeBase = optionalSettings.reforgeLevel2 ? 10 : 3;

                // --- Persistent State/Penalties/Modifiers ---
                let dBonusPerCard = 0;    // D: Heat Up bonus for A, B, I (cumulative, +10)
                let aBonusPerCard = 0;    // A: Forge Expert cumulative bonus (+5 for future A's)
                let eChargeActive = false;  // E: Charge (now persistent)
                let fMultiTriggers = 0;   // F: Multi-Forge (stacking extra triggers)
                let gReforgeBonus = 0;    // G: Reforge bonus (cumulative, added to x and y on Artisan trigger)
                let hSharpeningActive = false; // H: Sharpening is active (boolean for non-stacking)
                let cardsSeenGlobally = new Set(); // H: Tracks unique cards drawn
                
                // --- Forge Setup Modifiers ---
                let forgeCardsPlayed = 0; // For Fireproof Helm (B) bonus

                const getHighestBuffCount = (dApplied, eApplied, fApplied, gApplied) => {
                    return (dApplied ? 1 : 0) + (eApplied ? 1 : 0) + (fApplied ? 1 : 0) + (gApplied ? 1 : 0);
                };

                const applyArtisanEffect = (baseAdd, cardType) => {
                    let numTriggers = 1;
                    
                    // F: Multi-Forge triggers
                    if (fMultiTriggers > 0) {
                        numTriggers += (fMultiTriggers * 2);
                        fMultiTriggers = 0; // Consume F effect
                    }

                    // I: Pyroburst condition check
                    let iExtraTriggers = 0;
                    let iDApplied = (cardType === 'I' && dBonusPerCard > 0);
                    let iEApplied = (cardType === 'I' && eChargeActive); 
                    let iFApplied = (cardType === 'I' && fMultiTriggers > 0); 
                    let iGApplied = (cardType === 'I' && gReforgeBonus > 0);
                    
                    if (cardType === 'I' && getHighestBuffCount(iDApplied, iEApplied, iFApplied, iGApplied) >= 2) {
                        iExtraTriggers = 2; // Pyroburst triggers 2 extra times
                    }
                    numTriggers += iExtraTriggers;

                    const runEffectIteration = (affectsBothOverride = false) => {
                        let currentAdd = baseAdd + dBonusPerCard + (cardType === 'A' ? aBonusPerCard : 0); 
                        let affectsBoth = affectsBothOverride;

                        // Apply base effect
                        if (affectsBoth) {
                            x += currentAdd; y += currentAdd;
                        } else if (Math.random() < 0.5) {
                            x += currentAdd;
                        } else {
                            y += currentAdd;
                        }

                        // G: Reforge bonus (uses cumulative gReforgeBonus)
                        x += gReforgeBonus; y += gReforgeBonus;
                        
                        // A: Cumulative bonus for future A's 
                        if (cardType === 'A' && startingBonusType === 'firefangSwordA' && Math.random() < 0.3) {
                            // Run the effect once more, non-recursively.
                            let bonusA = baseAdd + dBonusPerCard + aBonusPerCard; 
                            if (Math.random() < 0.5) { x += bonusA; } else { y += bonusA; }
                            x += gReforgeBonus; y += gReforgeBonus;
                        }

                        x = clampToMin1(x); y = clampToMin1(y);
                    };

                    // --- Main Triggers Loop ---
                    for(let i = 0; i < numTriggers; i++) {
                        const isCharged = eChargeActive;
                        
                        // Fireproof Helm modification (Only affects Card B/Forge)
                        let isHelmCharged = false;
                        if (cardType === 'B' && startingBonusType === 'fireproofHelmLimit' && forgeCardsPlayed < 3) {
                            isHelmCharged = true;
                        }

                        runEffectIteration(isCharged || isHelmCharged);
                    }
                    
                    // A: Cumulative bonus for future A's 
                    if (cardType === 'A') { aBonusPerCard += 5; } 
                };

                for (const card of cardPermutation) {
                    const isNewCard = !cardsSeenGlobally.has(card);
                    
                    if (card === 'A') { applyArtisanEffect(5, 'A'); } 
                    else if (card === 'B') { 
                        applyArtisanEffect(bForgeBase, 'B'); // Use bForgeBase (10 or 15)
                        if (startingBonusType === 'fireproofHelmLimit' && forgeCardsPlayed < 3) {
                            forgeCardsPlayed++;
                        }
                    } 
                    else if (card === 'C') { Math.random() < 0.5 ? x *= 2 : y *= 2; } 
                    else if (card === 'D') { dBonusPerCard += 10; }
                    else if (card === 'E') { eChargeActive = true; }
                    else if (card === 'F') { fMultiTriggers += 1; } 
                    else if (card === 'G') { gReforgeBonus += gReforgeBase; } // Uses configurable gReforgeBase
                    else if (card === 'H') { hSharpeningActive = true; } 
                    else if (card === 'I') { applyArtisanEffect(12, 'I'); }

                    x = clampToMin1(x); y = clampToMin1(y);

                    // H: Sharpening effect applied (Fixed +10 if H is active and card is new)
                    if (isNewCard && hSharpeningActive) {
                        Math.random() < 0.5 ? x += 10 : y += 10;
                        x = clampToMin1(x); y = clampToMin1(y);
                    }
                    cardsSeenGlobally.add(card);
                }
                    
                return x * y;
            }
        };

        const ALL_GAMES = {
            'alchemy': ALCHEMY_CONFIG,
            'kitchen': KITCHEN_CONFIG,
            'forge': FORGE_CONFIG
        };

        let activeGameConfig = ALCHEMY_CONFIG; // Start with Alchemy

        // ====================================================================
        // === GENERIC SIMULATION & UTILITY FUNCTIONS =========================
        // ====================================================================
        
        function clampToMin1(value) {
            return Math.max(1, value);
        }

        function calculateSingleProbability(config, cardsListBase, threshold, numSimulations, startingBonusType, optionalSettings) {
            let totalSuccessfulSimulations = 0;
            
            for (let i = 0; i < numSimulations; i++) {
                const cards = [...cardsListBase];
                for (let j = cards.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [cards[j], cards[k]] = [cards[k], cards[j]];
                }

                const product = config.simulateGame(cards, startingBonusType, optionalSettings);
                if (product > threshold) {
                    totalSuccessfulSimulations++;
                }
            }
            
            return (totalSuccessfulSimulations / numSimulations) * 100;
        }

        function generateCombinations(numCards, cardMaxes) {
            const cardLetters = Object.keys(cardMaxes).sort();
            const combinations = [];

            function recursiveGenerator(index, currentCounts, currentSum) {
                if (index === cardLetters.length) {
                    if (currentSum === numCards) {
                        combinations.push({...currentCounts});
                    }
                    return;
                }

                const cardLetter = cardLetters[index];
                const maxCount = cardMaxes[cardLetter];
                
                for (let count = 0; count <= maxCount; count++) {
                    if (currentSum + count <= numCards) {
                        currentCounts[cardLetter] = count;
                        recursiveGenerator(index + 1, currentCounts, currentSum + count);
                    }
                }
                delete currentCounts[cardLetter]; // Backtrack
            }

            const initialCounts = {};
            recursiveGenerator(0, initialCounts, 0);
            return combinations;
        }
        
        // ====================================================================
        // === UI & EVENT HANDLERS ============================================
        // ====================================================================

        const numCardsInput = document.getElementById('numCards');
        const threshold1Input = document.getElementById('threshold1');
        const threshold2Input = document.getElementById('threshold2');
        const setupSelector = document.getElementById('setupSelector');
        const startingBonusText = document.getElementById('startingBonusText');
        const cardDefinitionsDiv = document.getElementById('card-definitions');
        const gameTitle = document.getElementById('game-title');
        const optionalBonusesContainer = document.getElementById('optional-bonuses-container');


        function updateUIFromSetup() {
            const setupId = setupSelector.value;
            const config = activeGameConfig.setupConfigs[setupId];
            
            // Set the recommended number of cards and thresholds. NumCards is editable.
            numCardsInput.value = config.numCards;
            threshold1Input.value = config.t1;
            threshold2Input.value = config.t2;

            // Update starting bonus text
            let bonusDescription = 'Includes: No bonus.';
            if (config.bonusType === 'firewardRingStart') {
                bonusDescription = 'Includes: +15 to Random Color at Start.';
            } else if (config.bonusType === 'oddSweetEndGame') {
                bonusDescription = 'Includes: +5 to All Colors if final gap < 5.';
            } else if (config.bonusType === 'firefangSwordA') {
                bonusDescription = 'Includes: Forge Expert (A) has 30% chance for 1 extra non-recursive trigger.';
            } else if (config.bonusType === 'fireproofHelmLimit') {
                bonusDescription = 'Includes: First 3 Forge (B) cards affect both X and Y.';
            }

            startingBonusText.textContent = bonusDescription;
        }

        function renderOptionalBonuses(gameId) {
            optionalBonusesContainer.innerHTML = ''; 
            optionalBonusesContainer.classList.add('hidden');

            if (gameId === 'alchemy') {
                optionalBonusesContainer.classList.remove('hidden');
                optionalBonusesContainer.innerHTML = `
                    <div class="flex items-center mb-2">
                        <input id="grindLevel7" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="grindLevel7" class="ml-2 block text-sm font-medium text-gray-700">
                            Grind Level 7: +20 to Lowest Color, -6 to Highest Color.
                        </label>
                    </div>
                    <div class="flex items-center">
                        <input id="fuseLevel3" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="fuseLevel3" class="ml-2 block text-sm font-medium text-gray-700">
                            Fuse Level 3: +20 to All Colors and Redistribute Point Difference if Point Gap &lt; 50.
                        </label>
                    </div>
                `;
            } else if (gameId === 'kitchen') {
                optionalBonusesContainer.classList.remove('hidden');
                optionalBonusesContainer.innerHTML = `
                    <div class="flex items-center mb-2">
                        <input id="slowCookLevel4" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="slowCookLevel4" class="ml-2 block text-sm font-medium text-gray-700">
                            Slow Cook Level 4: +5 to All Colors when Heat Control Triggers.
                        </label>
                    </div>
                    <div class="flex items-center">
                        <input id="cutLevel7" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="cutLevel7" class="ml-2 block text-sm font-medium text-gray-700">
                            Cut Level 7: Consecutive Cuts trigger 1 extra time per streak length (e.g., 3 in row = 1+2+3 triggers).
                        </label>
                    </div>
                `;
            } else if (gameId === 'forge') {
                optionalBonusesContainer.classList.remove('hidden');
                optionalBonusesContainer.innerHTML = `
                    <div class="flex items-center mb-2">
                        <input id="forgeLevel6" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="forgeLevel6" class="ml-2 block text-sm font-medium text-gray-700">
                            Forge Level 6: +15 to Random Color (instead of +10).
                        </label>
                    </div>
                    <div class="flex items-center">
                        <input id="reforgeLevel2" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="reforgeLevel2" class="ml-2 block text-sm font-medium text-gray-700">
                            Reforge Level 2: +10 to All Colors when Artisan effect triggers (instead of +3).
                        </label>
                    </div>
                `;
            }
            // Add event listeners for the new checkboxes (they are dynamically created)
            if (gameId === 'alchemy') {
                document.getElementById('grindLevel7').addEventListener('change', updateUIFromSetup);
                document.getElementById('fuseLevel3').addEventListener('change', updateUIFromSetup);
            } else if (gameId === 'forge') {
                 document.getElementById('forgeLevel6').addEventListener('change', updateUIFromSetup);
                 document.getElementById('reforgeLevel2').addEventListener('change', updateUIFromSetup);
            }
        }

        function switchTab(gameId) {
            // 1. Update Active Config
            activeGameConfig = ALL_GAMES[gameId];

            // 2. Update Tab Styling
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`${gameId}-tab-btn`).classList.add('active');

            // 3. Update Game Title
            gameTitle.textContent = activeGameConfig.title;

            // 4. Render Card Definitions
            cardDefinitionsDiv.innerHTML = `
                <h2 class="text-xl font-semibold text-indigo-700 mb-2">Current Card Effects</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-1 text-sm">
                    ${Object.keys(activeGameConfig.cardDetails).map(letter => {
                        const fullDesc = activeGameConfig.cardDetails[letter];
                        const parts = fullDesc.split(':');
                        const nameAndMax = parts[0].trim(); // e.g., 'A: Ingredients (max 4)'
                        const effect = parts.slice(1).join(':').trim(); // e.g., '+20 to Highest Color, -4 to Lowest Color.'
                        
                        // Remove the letter prefix for display
                        const simpleName = nameAndMax.substring(nameAndMax.indexOf(':') + 1).trim();

                        return `<p><span class="card-name">${simpleName}</span>: ${effect}</p>`;
                    }).join('')}
                </div>
            `;
            
            // 5. Render Presets Dropdown
            setupSelector.innerHTML = '';
            const configs = activeGameConfig.setupConfigs;
            let firstKey = null;
            let isFirst = true;
            for (const key in configs) {
                if (isFirst) { firstKey = key; isFirst = false; }
                const option = document.createElement('option');
                option.value = key;
                option.textContent = configs[key].name;
                setupSelector.appendChild(option);
            }

            // 6. Apply initial preset values
            setupSelector.value = firstKey;
            updateUIFromSetup();

            // 7. Render Optional Bonuses (like the Slow Cook Level 4 checkbox)
            renderOptionalBonuses(gameId);
            
            // 8. Clear Results
            document.getElementById('resultsTable').classList.add('hidden');
            document.getElementById('noResults').classList.add('hidden');
            document.getElementById('totalCombinations').textContent = '';
        }

        async function runSimulation() {
            const numCards = parseInt(numCardsInput.value); 
            const threshold1 = parseInt(threshold1Input.value); 
            const threshold2 = parseInt(threshold2Input.value); 
            const setupId = setupSelector.value;
            const config = activeGameConfig.setupConfigs[setupId];
            const startingBonusType = config.bonusType;

            // Capture optional settings for the active game
            let optionalSettings = {};
            if (activeGameConfig.id === 'alchemy') {
                optionalSettings.grindLevel7 = document.getElementById('grindLevel7')?.checked || false;
                optionalSettings.fuseLevel3 = document.getElementById('fuseLevel3')?.checked || false;
            } else if (activeGameConfig.id === 'kitchen') {
                optionalSettings.slowCookLevel4 = document.getElementById('slowCookLevel4')?.checked || false;
                optionalSettings.cutLevel7 = document.getElementById('cutLevel7')?.checked || false;
            } else if (activeGameConfig.id === 'forge') {
                optionalSettings.forgeLevel6 = document.getElementById('forgeLevel6')?.checked || false;
                optionalSettings.reforgeLevel2 = document.getElementById('reforgeLevel2')?.checked || false; // Capture new setting
            }

            const runButton = document.getElementById('runSimulation');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultsTable = document.getElementById('resultsTable');
            const noResults = document.getElementById('noResults');
            const totalCombinations = document.getElementById('totalCombinations');
            const resultsBody = resultsTable.querySelector('tbody');

            // Validation
            if (numCards < MIN_CARDS || numCards > MAX_CARDS || isNaN(numCards)) {
                alert(`Please enter a valid number of cards between ${MIN_CARDS} and ${MAX_CARDS}.`);
                return;
            }
            if (isNaN(threshold1) || isNaN(threshold2)) {
                alert('Please enter valid numeric values for both thresholds.');
                return;
            }

            // UI State: Running
            runButton.disabled = true;
            loadingIndicator.classList.remove('hidden');
            resultsTable.classList.add('hidden');
            noResults.classList.add('hidden');
            resultsBody.innerHTML = '';
            totalCombinations.textContent = '';
            
            const allCardCounts = generateCombinations(numCards, activeGameConfig.cardMaxes);
            totalCombinations.textContent = `Testing ${allCardCounts.length} total unique card combinations for ${numCards} cards.`;
            let probabilityResults = [];

            // Process combinations in chunks to allow the UI to update (non-blocking)
            const chunkSize = 50; 
            for (let i = 0; i < allCardCounts.length; i += chunkSize) {
                const chunk = allCardCounts.slice(i, i + chunkSize);
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        for (const counts of chunk) {
                            const cardsListBase = [];
                            for (const letter in counts) {
                                cardsListBase.push(...Array(counts[letter]).fill(letter));
                            }
                            
                            const prob1 = calculateSingleProbability(activeGameConfig, cardsListBase, threshold1, NUM_SIMULATIONS, startingBonusType, optionalSettings);
                            
                            probabilityResults.push({
                                counts,
                                probability_1: prob1,
                                cards_list_base: cardsListBase,
                            });
                        }
                        loadingIndicator.textContent = `Calculating... Processed ${Math.min(i + chunkSize, allCardCounts.length)} of ${allCardCounts.length} combinations.`;
                        resolve();
                    }, 0); 
                });
            }

            // 1. Sort by primary probability (descending)
            probabilityResults.sort((a, b) => b.probability_1 - a.probability_1);
            
            // 2. Filter non-zero results and take the top 5
            const top5Results = probabilityResults.filter(r => r.probability_1 > 0).slice(0, 5);

            // 3. Calculate Secondary Threshold Probability for Top 5
            for (const result of top5Results) {
                result.probability_2 = calculateSingleProbability(activeGameConfig, result.cards_list_base, threshold2, NUM_SIMULATIONS, startingBonusType, optionalSettings);
            }

            // 4. Display results
            if (top5Results.length > 0) {
                top5Results.forEach((result, index) => {
                    const combinationStringArray = [];
                    const sortedLetters = Object.keys(result.counts).sort();
                    
                    for (const letter of sortedLetters) {
                        const count = result.counts[letter];
                        if (count > 0) {
                            const fullDesc = activeGameConfig.cardDetails[letter];
                            // Split on the first colon to separate Name/Max from Effect
                            const parts = fullDesc.split(':');
                            const nameAndMax = parts[0].trim(); // e.g., 'A: Ingredients (max 4)'
                            
                            // Remove the letter prefix and max count from the name for a cleaner result list
                            const simpleName = nameAndMax.substring(nameAndMax.indexOf(':') + 1).trim().replace(/\s*\(max\s*\d\)/, '');
                            
                            // Collect card name and count string
                            combinationStringArray.push(`${simpleName} (x${count})`);
                        }
                    }

                    // Join array into a single comma-separated string
                    const combinationString = combinationStringArray.join(', ');
                    
                    const row = resultsBody.insertRow();
                    row.className = index % 2 === 0 ? 'bg-gray-50' : 'bg-white';
                    
                    row.innerHTML = `
                        <td class="font-bold">${index + 1}</td>
                        <td class="py-2">
                            <div class="font-bold text-gray-800">${combinationString}</div>
                        </td>
                        <td class="text-right font-mono text-lg text-indigo-700">${result.probability_1.toFixed(2)}%</td>
                        <td class="text-right font-mono text-lg text-gray-600">${result.probability_2.toFixed(2)}%</td>
                    `;
                });
                resultsTable.classList.remove('hidden');
            } else {
                noResults.classList.remove('hidden');
            }

            // UI State: Finished
            runButton.disabled = false;
            loadingIndicator.classList.add('hidden');
        }
        
        function swapThresholds() {
            const t1Input = document.getElementById('threshold1');
            const t2Input = document.getElementById('threshold2');
            
            const temp = t1Input.value;
            t1Input.value = t2Input.value;
            t2Input.value = temp;
        }


        // --- Initialization ---

        // Set up event listeners
        document.getElementById('swapThresholds').addEventListener('click', swapThresholds);
        document.getElementById('runSimulation').addEventListener('click', runSimulation);
        setupSelector.addEventListener('change', updateUIFromSetup);

        // Load the initial tab (Alchemy)
        switchTab('alchemy'); 

    </script>
</body>
